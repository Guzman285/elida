<!doctype html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<!-- Inicio del documento HTML, idioma español -->

<head>
<!-- Sección de configuración (no visible en pantalla) -->

  <meta charset="UTF-8" />
  <!-- Codificación de caracteres: permite tildes y ñ -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Adaptación a móvil: no hace zoom automático -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Pre-conexión a Google Fonts para cargar más rápido -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Pre-conexión al servidor de archivos de fuentes -->

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <!-- Importa fuentes: Great Vibes (cursiva nombres) y Cormorant Garamond (textos) -->

  <title>Boda Carlos &amp; Elida</title>
  <!-- Título que aparece en la pestaña del navegador -->

  <style>
  /* ---- Inicio de estilos CSS ---- */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Elimina márgenes y padding por defecto en todos los elementos */

    :root {
    /* Variables globales de color reutilizables en todo el archivo */
      --terracota: #b86b52;      /* color terracota claro: textos secundarios */
      --terracota-dark: #5c3528; /* color terracota oscuro: nombres principales */
    }

    html, body {
      width: 100%;               /* ancho completo de la pantalla */
      height: 100%;              /* alto completo de la pantalla */
      overflow: hidden;          /* SIN SCROLL: oculta lo que se salga de pantalla */
      font-family: 'Cormorant Garamond', Georgia, serif; /* fuente principal */
      background-color: #f5ece3; /* color de fondo si la imagen no carga */
      background-image: url('./assets/img/fondos/fondo1.jpg'); /* imagen de fondo */
      background-size: cover;    /* la imagen cubre toda la pantalla */
      background-position: center center; /* imagen centrada */
      background-repeat: no-repeat;       /* la imagen no se repite */
    }

    .flor-izq {
    /* Flor decorativa esquina superior IZQUIERDA */
      position: fixed;           /* fija en pantalla, no se mueve */
      top: -180px;                /* sube 10px fuera del borde superior */
      left: -85px;               /* sale 14px por el borde izquierdo */
      width: clamp(180px, 55vw, 300px); /* tamaño fluido: mín 110px, ideal 32vw, máx 160px */
      height: auto;              /* alto proporcional al ancho */
      pointer-events: none;      /* el mouse la ignora, no bloquea clicks */
      z-index: 0;                /* capa 0: detrás del contenido principal */
      transform: scaleX(-1);     /* espejo horizontal: voltea la imagen */
    }

    .flor-der {
    /* Flor decorativa esquina superior DERECHA */
      position: fixed;           /* fija en pantalla */
      top: 800px;                /* sube 10px fuera del borde superior */
      right: -40px;              /* sale 14px por el borde derecho */
      width: clamp(150px, 45vw, 250px); /* tamaño fluido igual que flor izquierda */
      height: auto;              /* alto proporcional */
      pointer-events: none;      /* no bloquea clicks */
      z-index: 0;                /* capa detrás del contenido */
    }

    .pagina {
    /* Contenedor principal: centra todo el contenido en pantalla */
      position: fixed;           /* ocupa toda la pantalla fijamente */
      inset: 0;                  /* equivale a top:0 right:0 bottom:0 left:0 */
      z-index: 1;                /* capa 1: encima de las flores */
      display: flex;             /* activa flexbox */
      flex-direction: column;    /* apila los hijos verticalmente */
      align-items: center;       /* centra horizontalmente */
      justify-content: center;   /* centra verticalmente */
      text-align: center;        /* texto centrado */
      padding: clamp(80px, 38vw, 50px) /* padding superior: controla posición vertical del bloque */
               24px              /* padding izquierdo y derecho */
               clamp(20px, 5vw, 40px); /* padding inferior */
      gap: clamp(2px, 1vw, 8px); /* espacio entre pretítulo, nombres y fecha */
    }

    .pretitulo {
    /* Texto "NUESTRA BODA" */
      font-size: clamp(1.60rem, 3.6vw, 1.74rem); /* tamaño pequeño fluido */
      letter-spacing: 5px;       /* espacio amplio entre letras */
      text-transform: uppercase; /* convierte a MAYÚSCULAS automáticamente */
      color: var(--terracota);   /* color terracota claro */
      opacity: 0.90;             /* ligera transparencia */
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both; /* entra desde arriba */
    }

    .nombres {
    /* Texto "Carlos & Elida" */
      font-family: 'Great Vibes', cursive; /* fuente cursiva elegante */
      font-size: clamp(3.2rem, 20vw, 4.2rem); /* tamaño grande fluido */
      color: var(--terracota-dark); /* color oscuro */
      line-height: 1.05;         /* altura de línea ajustada */
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.1s both; /* entra con 0.1s de retraso */
    }

    .fecha {
    /* Texto "13 · JUNIO · 2026" */
      font-size: clamp(1.60rem, 3.6vw, 1.76rem); /* tamaño pequeño */
      letter-spacing: 4px;       /* espaciado entre letras */
      text-transform: uppercase; /* en mayúsculas */
      color: var(--terracota);   /* color terracota */
      opacity: 0.80;             /* más transparente que el pretítulo */
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.2s both; /* entra con 0.2s de retraso */
    }

    .sobre-bloque {
    /* Bloque que agrupa el sobre y el lacre */
      display: flex;             /* flexbox para apilarlos */
      flex-direction: column;    /* sobre arriba, lacre abajo */
      align-items: center;       /* centrados horizontalmente */
      margin-top: clamp(12px, 3vw, 24px); /* espacio entre la fecha y el sobre */
      animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s both; /* sube desde abajo */
    }

    .sobre-img {
    /* Imagen del sobre (sobres.png) */
      width: clamp(200px, 68vw, 340px); /* tamaño fluido del sobre */
      height: auto;              /* alto proporcional al ancho */
      display: block;            /* evita espacio extra debajo de la imagen */
      pointer-events: none;      /* no es clickeable */
      filter: drop-shadow(0 6px 20px rgba(92,53,40,0.22)); /* sombra café suave */
    }

    .boton-img {
    /* Imagen del lacre/botón (boton.png) */
      width: clamp(80px, 26vw, 130px);  /* tamaño fluido del lacre */
      height: auto;                     /* alto proporcional */
      display: block;                   /* evita espacio extra */
      cursor: pointer;                  /* cursor de mano al pasar encima */
      margin-top: -22px;                /* NEGATIVO: sube el lacre sobre el borde del sobre */
      filter:                           /* filtros para dar tono dorado al lacre */
        sepia(1)                        /* convierte a tonos café */
        saturate(2.2)                   /* intensifica el color */
        hue-rotate(5deg)                /* ajuste fino del tono */
        brightness(1.10)                /* claridad: subir = más claro, bajar = más oscuro */
        drop-shadow(0 4px 10px rgba(92,53,40,0.22)); /* sombra del lacre */
      transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), filter 0.22s ease; /* animación suave */
      -webkit-tap-highlight-color: transparent; /* elimina flash azul en móvil al tocar */
    }

    .boton-img:hover {
    /* Estado al pasar el mouse encima del lacre */
      filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(5deg)
        brightness(1.65)          /* más brillo en hover */
        drop-shadow(0 8px 18px rgba(92,53,40,0.30));
      transform: scale(1.07) translateY(-3px); /* agranda y sube ligeramente */
    }

    .boton-img:active {
    /* Estado al hacer click en el lacre */
      transform: scale(0.96);    /* se encoge al presionar */
    }

    @keyframes fadeDown {
    /* Animación: elementos entran cayendo desde arriba */
      from { opacity: 0; transform: translateY(-16px); } /* inicio: invisible y 16px arriba */
      to   { opacity: 1; transform: translateY(0); }     /* final: visible en su posición */
    }

    @keyframes fadeUp {
    /* Animación: el sobre entra subiendo desde abajo */
      from { opacity: 0; transform: translateY(22px); }  /* inicio: invisible y 22px abajo */
      to   { opacity: 1; transform: translateY(0); }     /* final: visible en su posición */
    }

    @media (prefers-reduced-motion: reduce) {
    /* Si el usuario prefiere sin animaciones en su sistema */
      *, *::before, *::after {
        animation-duration: 0.01ms !important;  /* animación casi instantánea */
        transition-duration: 0.01ms !important; /* transición casi instantánea */
      }
    }

  </style>
</head>

<body>
<!-- Cuerpo visible de la página -->

  <img src="./assets/img/sobre/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
  <!-- Flor esquina superior izquierda (espejada con scaleX(-1)) -->

  <img src="./assets/img/sobre/flor2.png" alt="" class="flor-der" aria-hidden="true" />
  <!-- Flor esquina superior derecha -->

  <div class="pagina">
  <!-- Contenedor principal centrado en pantalla -->

    <p class="pretitulo">Nuestra Boda</p>
    <!-- Texto pequeño: "NUESTRA BODA" -->

    <p class="nombres">Carlos &amp; Elida</p>
    <!-- Nombres en cursiva. &amp; = símbolo & en HTML -->

    <p class="fecha">13 &middot; Junio &middot; 2026</p>
    <!-- Fecha. &middot; = punto centrado · en HTML -->

    <div class="sobre-bloque">
    <!-- Bloque que contiene el sobre y el lacre juntos -->

      <img
        src="./assets/img/sobre/sobres.png"
        alt="Sobre de invitación"
        class="sobre-img"
        width="340"
        height="221"
        loading="eager"
      />
      <!-- Imagen del sobre: no clickeable, solo decorativa -->

      <img
        src="./assets/img/sobre/boton.png"
        alt="Click para abrir la invitación"
        class="boton-img"
        width="130"
        height="130"
        loading="eager"
        onclick="window.location.href='./invitacion-boda.html'"
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
      />
      <!-- Lacre/botón: al hacer click navega a la invitación -->
      <!-- onclick: cambia './invitacion-boda.html' por la ruta de tu página -->

    </div>
    <!-- fin .sobre-bloque -->

  </div>
  <!-- fin .pagina -->

</body>
<!-- Fin del cuerpo -->

</html>
<!-- Fin del documento -->
