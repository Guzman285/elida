<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =============================================
       FUENTES
       - Great Vibes     : nombres (Carlos & Elida)
       - Cormorant Garamond : textos secundarios
  ============================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

  <title>Boda Carlos &amp; Elida</title>

  <style>

    /* =============================================
       RESET BASICO
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* =============================================
       VARIABLES DE COLOR
       --terracota       : color del texto secundario y fecha
       --terracota-dark  : color de los nombres principales
    ============================================= */
    :root {
      --terracota: #b86b52;
      --terracota-dark: #5c3528;
    }

    /* =============================================
       BODY / FONDO
       - overflow: hidden  => sin scroll
       - background-image  => imagen de fondo (fondo1.jpg)
       - background-size: cover => cubre toda la pantalla
    ============================================= */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;                          /* SIN SCROLL */
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #f5ece3;                 /* color fallback si falla la imagen */
      background-image: url('./assets/img/fondos/fondo1.jpg'); /* IMAGEN DE FONDO */
      background-size: cover;                    /* cubre toda la pantalla */
      background-position: center center;        /* centrada */
      background-repeat: no-repeat;
    }

    /* =============================================
       FLORES DECORATIVAS (esquinas superiores)
       - .flor-izq : esquina superior izquierda (espejada)
       - .flor-der : esquina superior derecha
       - width     : tamano de las flores => ajustar aqui
    ============================================= */
    .flor-izq {
      position: fixed;
      top: -10px;                                /* posicion vertical desde arriba */
      left: -14px;                               /* posicion horizontal desde izquierda */
      width: clamp(110px, 32vw, 160px);          /* TAMANIO FLORES => cambiar estos valores */
      height: auto;
      pointer-events: none;
      z-index: 0;
      transform: scaleX(-1);                     /* espejo horizontal */
    }
    .flor-der {
      position: fixed;
      top: -10px;                                /* posicion vertical desde arriba */
      right: -14px;                              /* posicion horizontal desde derecha */
      width: clamp(110px, 32vw, 160px);          /* TAMANIO FLORES => cambiar estos valores */
      height: auto;
      pointer-events: none;
      z-index: 0;
    }

    /* =============================================
       CONTENEDOR PRINCIPAL
       - position: fixed + inset:0 => ocupa toda la pantalla
       - justify-content: center   => centra verticalmente
       - padding-top => controla que tan ARRIBA o ABAJO queda el bloque
         valores mas bajos = sube el contenido
         valores mas altos = baja el contenido
    ============================================= */
    .pagina {
      position: fixed;
      inset: 0;                                  /* cubre toda la pantalla */
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;                   /* centrado vertical */
      text-align: center;
      padding: clamp(80px, 18vw, 110px)          /* PADDING TOP => sube/baja todo el bloque */
               24px                              /* padding horizontal */
               clamp(16px, 4vw, 32px);           /* padding bottom */
      gap: clamp(2px, 1vw, 6px);                 /* espacio entre texto-pretitulo, nombres, fecha */
    }

    /* =============================================
       TEXTO: "NUESTRA BODA"
       - letter-spacing : espacio entre letras
       - font-size      : tamanio del texto
       - opacity        : transparencia (0=invisible, 1=solido)
    ============================================= */
    .pretitulo {
      font-size: clamp(0.60rem, 2.6vw, 0.74rem); /* TAMANIO => min, fluido, max */
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.90;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* =============================================
       TEXTO: "Carlos & Elida"
       - font-family : Great Vibes (cursiva elegante)
       - font-size   : el mas grande de la pagina
    ============================================= */
    .nombres {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 10vw, 3.8rem);    /* TAMANIO NOMBRES => ajustar aqui */
      color: var(--terracota-dark);
      line-height: 1.05;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }

    /* =============================================
       TEXTO: "13 · JUNIO · 2026"
    ============================================= */
    .fecha {
      font-size: clamp(0.60rem, 2.6vw, 0.76rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.80;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    /* =============================================
       BLOQUE SOBRE + LACRE
       - margin-top : espacio entre la fecha y el sobre
    ============================================= */
    .sobre-bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(10px, 2.5vw, 20px);      /* ESPACIO FECHA -> SOBRE => ajustar aqui */
      animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }

    /* =============================================
       IMAGEN DEL SOBRE (sobres.png)
       - width : tamanio del sobre
    ============================================= */
    .sobre-img {
      width: clamp(200px, 68vw, 340px);          /* TAMANIO SOBRE => ajustar aqui */
      height: auto;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 6px 20px rgba(92,53,40,0.22));
    }

    /* =============================================
       IMAGEN DEL LACRE / BOTON (boton.png)
       - width      : tamanio del lacre
       - margin-top : valor NEGATIVO lo sube encima del sobre
                      mas negativo = mas pegado al sobre
       - filter     : da el tono dorado al lacre
           sepia(1)         => convierte a marron
           saturate(2.2)    => intensifica color
           hue-rotate(5deg) => pequeno ajuste de tono
           brightness(1.45) => MAS CLARO (subir para mas claro, bajar para mas oscuro)
    ============================================= */
    .boton-img {
      width: clamp(70px, 22vw, 110px);           /* TAMANIO LACRE => ajustar aqui */
      height: auto;
      display: block;
      cursor: pointer;
      margin-top: -32px;                         /* PEGADO AL SOBRE => mas negativo = mas arriba */
      filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(5deg)
        brightness(1.45)                         /* CLARIDAD DEL LACRE => subir/bajar este valor */
        drop-shadow(0 4px 10px rgba(92,53,40,0.22));
      transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), filter 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* Estado hover del lacre (al pasar el mouse) */
    .boton-img:hover {
      filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(5deg)
        brightness(1.65)
        drop-shadow(0 8px 18px rgba(92,53,40,0.30));
      transform: scale(1.07) translateY(-3px);
    }
    /* Estado al hacer click */
    .boton-img:active {
      transform: scale(0.96);
    }

    /* =============================================
       ANIMACIONES DE ENTRADA
       fadeDown : elementos caen desde arriba
       fadeUp   : sobre sube desde abajo
    ============================================= */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Respeta la preferencia del usuario de sin animaciones */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>
<body>

  <!-- FLOR ESQUINA IZQUIERDA (espejada de flor2.png) -->
  <img src="./assets/img/fondos/flor1.png" alt="" class="flor-izq" aria-hidden="true" />

  <!-- FLOR ESQUINA DERECHA -->
  <img src="./assets/img/fondos/flor2.png" alt="" class="flor-der" aria-hidden="true" />

  <!-- BLOQUE PRINCIPAL -->
  <div class="pagina">

    <!-- Texto superior -->
    <p class="pretitulo">Nuestra Boda</p>
    <p class="nombres">Carlos &amp; Elida</p>
    <p class="fecha">13 &middot; Junio &middot; 2026</p>

    <!-- Sobre + Lacre -->
    <div class="sobre-bloque">

      <!-- IMAGEN DEL SOBRE -->
      <img
        src="./assets/img/sobre/sobres.png"
        alt="Sobre de invitacion"
        class="sobre-img"
        width="340"
        height="221"
        loading="eager"
      />

      <!-- LACRE / BOTON => al hacer click va a la invitacion -->
      <img
        src="./assets/img/sobre/boton.png"
        alt="Click para abrir la invitacion"
        class="boton-img"
        width="110"
        height="110"
        loading="eager"
        onclick="window.location.href='./invitacion-boda.html'"  <!-- RUTA DE LA INVITACION -->
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
      />

    </div>

  </div>

</body>
</html>
