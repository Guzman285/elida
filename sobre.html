<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <title>Boda Carlos &amp; Elida</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracota: #b86b52;
      --terracota-dark: #5c3528;
      --crema: #fdf8f4;
      --oro: #c9a84c;
    }

    html, body {
      min-height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: var(--crema);
      overflow-x: hidden;
    }

    /* ── FLORES ESQUINAS ── */
    .flor-izq {
      position: fixed;
      top: -10px;
      left: -18px;
      width: clamp(160px, 48vw, 240px);
      height: auto;
      pointer-events: none;
      z-index: 0;
      transform: scaleX(-1);
    }
    .flor-der {
      position: fixed;
      top: -10px;
      right: -18px;
      width: clamp(160px, 48vw, 240px);
      height: auto;
      pointer-events: none;
      z-index: 0;
    }

    /* ── CONTENIDO PRINCIPAL ── */
    .pagina {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(100px, 22vw, 140px) 24px clamp(48px, 10vw, 80px);
      text-align: center;
      gap: 0;
    }

    /* ── TEXTOS ── */
    .pretitulo {
      font-size: clamp(0.68rem, 3vw, 0.78rem);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.85;
      margin-bottom: 10px;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .nombres {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 14vw, 4.8rem);
      color: var(--terracota-dark);
      line-height: 1.05;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }

    .fecha {
      font-size: clamp(0.72rem, 3.2vw, 0.85rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.75;
      margin-top: 10px;
      margin-bottom: clamp(28px, 7vw, 44px);
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    /* ── SOBRE + BOTÓN ── */
    .sobre-bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }

    .sobre-img {
      width: clamp(260px, 82vw, 400px);
      height: auto;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 8px 28px rgba(92,53,40,0.18));
    }

    .boton-wrap {
      margin-top: -10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .boton-img {
      width: clamp(200px, 65vw, 300px);
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), filter 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(92,53,40,0.15));
    }
    .boton-img:hover {
      transform: scale(1.04) translateY(-2px);
      filter: drop-shadow(0 8px 20px rgba(92,53,40,0.22));
    }
    .boton-img:active {
      transform: scale(0.97);
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Flores decorativas -->
  <img src="./assets/img/fondos/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
  <img src="./assets/img/fondos/flor2.png" alt="" class="flor-der" aria-hidden="true" />

  <!-- Contenido -->
  <div class="pagina">

    <p class="pretitulo">Nuestra Boda</p>
    <p class="nombres">Carlos &amp; Elida</p>
    <p class="fecha">13 &middot; Junio &middot; 2026</p>

    <div class="sobre-bloque">
      <img
        src="./assets/img/sobre/sobres.png"
        alt="Sobre de invitación"
        class="sobre-img"
        width="400"
        height="260"
        loading="eager"
      />
      <div class="boton-wrap">
        <img
          src="./assets/img/sobre/boton.png"
          alt="Click para abrir la invitación"
          class="boton-img"
          width="300"
          height="80"
          loading="eager"
          onclick="irAInvitacion()"
          role="button"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){irAInvitacion();}"
        />
      </div>
    </div>

  </div>

  <script>
    function irAInvitacion() {
      window.location.href = './invitacion-boda.html';
    }
  </script>

</body>
</html>
