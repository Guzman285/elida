<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <title>Boda Carlos &amp; Elida</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracota: #b86b52;
      --terracota-dark: #5c3528;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #f5ece3;
      background-image: url('./assets/img/fondos/fondo1.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .flor-izq {
      position: fixed;
      top: -10px;
      left: -14px;
      width: clamp(110px, 32vw, 160px);
      height: auto;
      pointer-events: none;
      z-index: 0;
      transform: scaleX(-1);
    }
    .flor-der {
      position: fixed;
      top: -10px;
      right: -14px;
      width: clamp(110px, 32vw, 160px);
      height: auto;
      pointer-events: none;
      z-index: 0;
    }

    .pagina {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(120px, 28vw, 160px) 24px clamp(20px, 5vw, 40px);
      gap: clamp(4px, 1.5vw, 10px);
    }

    .pretitulo {
      font-size: clamp(0.85rem, 3.5vw, 1.05rem); /* era 0.60-0.74rem, ahora mas grande */
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.90;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .nombres {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 13vw, 5rem); /* era 2.2-3.8rem, ahora mas grande */
      color: var(--terracota-dark);
      line-height: 1.05;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }

    .fecha {
      font-size: clamp(0.85rem, 3.5vw, 1.05rem); /* era 0.60-0.76rem, ahora mas grande */
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.80;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    .sobre-bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(12px, 3vw, 24px);
      animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }

    .sobre-img {
      width: clamp(200px, 68vw, 340px);
      height: auto;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 6px 20px rgba(92,53,40,0.22));
    }

    .boton-img {
      width: clamp(80px, 26vw, 130px);
      height: auto;
      display: block;
      cursor: pointer;
      margin-top: -22px;
      filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(5deg)
        brightness(1.45)
        drop-shadow(0 4px 10px rgba(92,53,40,0.22));
      transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), filter 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .boton-img:hover {
      filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(5deg)
        brightness(1.65)
        drop-shadow(0 8px 18px rgba(92,53,40,0.30));
      transform: scale(1.07) translateY(-3px);
    }
    .boton-img:active {
      transform: scale(0.96);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <img src="./assets/img/fondos/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
  <img src="./assets/img/fondos/flor2.png" alt="" class="flor-der" aria-hidden="true" />

  <div class="pagina">

    <p class="pretitulo">Nuestra Boda</p>
    <p class="nombres">Carlos &amp; Elida</p>
    <p class="fecha">13 &middot; Junio &middot; 2026</p>

    <div class="sobre-bloque">
      <img
        src="./assets/img/sobre/sobres.png"
        alt="Sobre de invitación"
        class="sobre-img"
        width="340"
        height="221"
        loading="eager"
      />
      <img
        src="./assets/img/sobre/boton.png"
        alt="Click para abrir la invitación"
        class="boton-img"
        width="130"
        height="130"
        loading="eager"
        onclick="window.location.href='./invitacion-boda.html'"
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
      />
    </div>

  </div>

</body>
</html>
