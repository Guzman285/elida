<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
    <title>Boda Carlos &amp; Elida</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --terracota: #9e4e35;
        --terracota-dark: #4a2218;
        --sobre-w: clamp(180px, 62vw, 340px);
      }

      html { height: 100%; }

      body {
        min-height: 100dvh;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        font-family: 'Cormorant Garamond', Georgia, serif;
        background-color: #f5ece3;
        background-image: url('./assets/img/fondos/fondo1.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* ---- Flores ---- */
      .flor-izq {
        position: fixed;
        top: clamp(-180px, -28vw, -100px);   /* más arriba que antes */
        left: clamp(-70px, -10vw, -40px);
        width: clamp(130px, 42vw, 300px);
        height: auto;
        pointer-events: none;
        z-index: 0;
        transform: scaleX(-1);
      }

      .flor-der {
        position: fixed;
        bottom: clamp(-80px, -12vw, -40px);
        right: clamp(-50px, -8vw, -20px);
        width: clamp(120px, 40vw, 250px);
        height: auto;
        pointer-events: none;
        z-index: 0;
      }

      /* ---- Contenedor principal ---- */
      .pagina {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: clamp(80px, 18vw, 150px) 24px clamp(40px, 8vw, 80px);
        gap: clamp(2px, 1.2vw, 10px);
      }

      .pretitulo {
        font-size: clamp(0.9rem, 3.8vw, 1.74rem);
        font-weight: 600;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 1;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .nombres {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(2.6rem, 16vw, 4.2rem);
        color: var(--terracota-dark);
        line-height: 1.05;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .fecha {
        font-size: clamp(0.9rem, 3.8vw, 1.76rem);
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 1;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }

      /* ---- Contenedor del sobre ---- */
      .sobre-wrapper {
        position: relative;
        display: inline-block;
        margin-top: clamp(8px, 2.5vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }

      .sobre-img {
        width: var(--sobre-w);
        height: auto;
        display: block;
        filter: drop-shadow(0 6px 20px rgba(92, 53, 40, 0.22));
        pointer-events: none;
      }

      /* ---- Área clicable: botón dorado central ---- */
      .boton-area {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translateX(-50%);
        width: 28%;
        aspect-ratio: 1;
        border-radius: 50%;
        cursor: pointer;
        z-index: 2;
        -webkit-tap-highlight-color: transparent;
        /* background: rgba(255,0,0,0.3); */ /* descomenta para depurar */
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .boton-area:hover  { transform: translateX(-50%) scale(1.08); }
      .boton-area:active { transform: translateX(-50%) scale(0.95); }
      .boton-area:focus-visible {
        outline: 2px solid var(--terracota);
        outline-offset: 4px;
      }

      /* ---- Sección "Hemos Reservado" ---- */
      .reservado-bloque {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 2vw, 10px);
        margin-top: clamp(14px, 4vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      .click-texto {
        font-size: clamp(0.72rem, 2.8vw, 1rem);
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 1;
      }

      .reservado-titulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 1;
        margin-top: 2px;
      }

      .reservado-numero {
        width: clamp(48px, 13vw, 76px);
        height: clamp(48px, 13vw, 76px);
        border: 2px solid var(--terracota-dark);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        font-weight: 400;
        color: var(--terracota-dark);
        opacity: 1;
      }

      .reservado-subtitulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 1;
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-height: 700px) {
        .pagina { padding-top: clamp(60px, 12vw, 90px); gap: 2px; }
        .sobre-wrapper    { margin-top: 6px; }
        .reservado-bloque { margin-top: 8px; gap: 4px; }
      }
    </style>
  </head>

  <body>

    <img src="./assets/img/sobre/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
    <img src="./assets/img/sobre/flor2.png" alt="" class="flor-der" aria-hidden="true" />

    <div class="pagina">

      <p class="pretitulo">Nuestra Boda</p>
      <p class="nombres">Carlos &amp; Elida</p>
      <p class="fecha">13 &middot; Junio &middot; 2026</p>

      <div class="sobre-wrapper">
        <img
          src="./assets/img/sobre/sobre2.png"
          alt="Sobre de invitación de boda"
          class="sobre-img"
          width="340"
          height="221"
          loading="eager"
        />
        <a
          href="./invitacion-boda.html"
          class="boton-area"
          aria-label="Abrir invitación de boda"
          tabindex="0"
        ></a>
      </div>

      <div class="reservado-bloque">
        <p class="click-texto">Click para abrir la invitación</p>
        <p class="reservado-titulo">Hemos Reservado</p>
        <div class="reservado-numero">2</div>
        <p class="reservado-subtitulo">Lugares en su Honor</p>
      </div>

    </div>

  </body>
</html>
