<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <title>Boda Carlos &amp; Elida</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracota: #b86b52;
      --terracota-dark: #5c3528;
      --crema: #fdf8f4;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: var(--crema);
    }

    /* ── FLORES ESQUINAS ── */
    .flor-izq {
      position: fixed;
      top: -10px;
      left: -18px;
      width: clamp(140px, 42vw, 220px);
      height: auto;
      pointer-events: none;
      z-index: 0;
      transform: scaleX(-1);
    }
    .flor-der {
      position: fixed;
      top: -10px;
      right: -18px;
      width: clamp(140px, 42vw, 220px);
      height: auto;
      pointer-events: none;
      z-index: 0;
    }

    /* ── CONTENIDO: ocupa exactamente la pantalla ── */
    .pagina {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(90px, 20vw, 130px) 24px clamp(24px, 6vw, 48px);
      gap: clamp(4px, 1.5vw, 10px);
    }

    /* ── TEXTOS ── */
    .pretitulo {
      font-size: clamp(0.62rem, 2.8vw, 0.76rem);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.85;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .nombres {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.4rem, 11vw, 4.2rem);
      color: var(--terracota-dark);
      line-height: 1.05;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }

    .fecha {
      font-size: clamp(0.62rem, 2.8vw, 0.78rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--terracota);
      opacity: 0.75;
      animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    /* ── SOBRE + BOTÓN ── */
    .sobre-bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }

    .sobre-img {
      width: clamp(220px, 72vw, 360px);
      height: auto;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 8px 24px rgba(92,53,40,0.18));
    }

    .boton-img {
      width: clamp(170px, 58vw, 270px);
      height: auto;
      display: block;
      cursor: pointer;
      margin-top: -8px;
      transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), filter 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(92,53,40,0.14));
    }
    .boton-img:hover {
      transform: scale(1.05) translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(92,53,40,0.22));
    }
    .boton-img:active {
      transform: scale(0.97);
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Flores decorativas -->
  <img src="./assets/img/fondos/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
  <img src="./assets/img/fondos/flor2.png" alt="" class="flor-der" aria-hidden="true" />

  <!-- Contenido -->
  <div class="pagina">

    <p class="pretitulo">Nuestra Boda</p>
    <p class="nombres">Carlos &amp; Elida</p>
    <p class="fecha">13 &middot; Junio &middot; 2026</p>

    <div class="sobre-bloque">
      <img
        src="./assets/img/sobre/sobres.png"
        alt="Sobre de invitación"
        class="sobre-img"
        width="360"
        height="234"
        loading="eager"
      />
      <img
        src="./assets/img/sobre/boton.png"
        alt="Click para abrir la invitación"
        class="boton-img"
        width="270"
        height="72"
        loading="eager"
        onclick="window.location.href='./invitacion-boda.html'"
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
      />
    </div>

  </div>

</body>
</html>
