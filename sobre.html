<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
    <title>Boda Carlos &amp; Elida</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --terracota: #b86b52;
        --terracota-dark: #5c3528;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        min-height: 100dvh;           /* dynamic viewport height — respeta barra del navegador */
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;             /* permite scroll si el contenido no cabe */
        font-family: 'Cormorant Garamond', Georgia, serif;
        background-color: #f5ece3;
        background-image: url('./assets/img/fondos/fondo1.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed; /* fija el fondo mientras se hace scroll */
      }

      /* Flores decorativas — tamaño reducido en pantallas pequeñas */
      .flor-izq {
        position: fixed;
        top: -180px;
        left: -85px;
        width: clamp(130px, 40vw, 300px);
        height: auto;
        pointer-events: none;
        z-index: 0;
        transform: scaleX(-1);
      }

      .flor-der {
        position: fixed;
        bottom: -60px;
        top: auto;                    /* desactiva el top: 800px que se salía */
        right: -40px;
        width: clamp(120px, 38vw, 250px);
        height: auto;
        pointer-events: none;
        z-index: 0;
      }

      /* Contenedor principal — usa min-height en lugar de fixed */
      .pagina {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;      /* centra verticalmente si hay espacio */
        text-align: center;
        padding: clamp(100px, 20vw, 160px) 24px clamp(40px, 8vw, 80px);
        gap: clamp(2px, 1.2vw, 10px);
      }

      .pretitulo {
        font-size: clamp(0.9rem, 3.8vw, 1.74rem);
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.9;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .nombres {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(2.6rem, 16vw, 4.2rem);
        color: var(--terracota-dark);
        line-height: 1.05;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .fecha {
        font-size: clamp(0.9rem, 3.8vw, 1.76rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.8;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }

      .sobre-bloque {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: clamp(8px, 2.5vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        position: relative;
      }

      .sobre-img {
        width: clamp(180px, 62vw, 340px);
        height: auto;
        display: block;
        pointer-events: none;
        filter: drop-shadow(0 6px 20px rgba(92, 53, 40, 0.22));
      }

      .boton-img {
        width: clamp(60px, 20vw, 130px);
        height: auto;
        display: block;
        cursor: pointer;
        margin-top: 0;
        margin-bottom: -100px;
        position: relative;
        top: 105px;
        z-index: 2;
        filter:
          sepia(1)
          saturate(2.2)
          hue-rotate(5deg)
          brightness(1.1)
          drop-shadow(0 4px 10px rgba(92, 53, 40, 0.22));
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .boton-img:hover {
        filter: sepia(1) saturate(2.2) hue-rotate(5deg) brightness(1.65)
          drop-shadow(0 8px 18px rgba(92, 53, 40, 0.3));
        transform: scale(1.07) translateY(-3px);
      }

      .boton-img:active {
        transform: scale(0.96);
      }

      /* ---- Sección "Hemos Reservado" ---- */
      .reservado-bloque {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 2vw, 10px);
        margin-top: clamp(14px, 4vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      .click-texto {
        font-size: clamp(0.72rem, 2.8vw, 1rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.75;
      }

      .reservado-titulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 0.85;
        margin-top: 2px;
      }

      .reservado-numero {
        width: clamp(48px, 13vw, 76px);
        height: clamp(48px, 13vw, 76px);
        border: 2px solid var(--terracota-dark);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        font-weight: 400;
        color: var(--terracota-dark);
        opacity: 0.85;
      }

      .reservado-subtitulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 0.85;
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Pantallas muy pequeñas (iPhone SE, 375px) */
      @media (max-height: 700px) {
        .pagina {
          padding-top: clamp(70px, 15vw, 110px);
          gap: 2px;
        }
        .sobre-bloque {
          margin-top: 6px;
        }
        .reservado-bloque {
          margin-top: 10px;
          gap: 5px;
        }
      }
    </style>
  </head>

  <body>

    <img src="./assets/img/sobre/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
    <img src="./assets/img/sobre/flor2.png" alt="" class="flor-der" aria-hidden="true" />

    <div class="pagina">

      <p class="pretitulo">Nuestra Boda</p>
      <p class="nombres">Carlos &amp; Elida</p>
      <p class="fecha">13 &middot; Junio &middot; 2026</p>

      <div class="sobre-bloque">
        <img
          src="./assets/img/sobre/boton.png"
          alt="Click para abrir la invitación"
          class="boton-img"
          width="130"
          height="130"
          loading="eager"
          onclick="window.location.href='./invitacion-boda.html'"
          role="button"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
        />
        <img
          src="./assets/img/sobre/sobres.png"
          alt="Sobre de invitación"
          class="sobre-img"
          width="340"
          height="221"
          loading="eager"
        />
      </div>

      <div class="reservado-bloque">
        <p class="click-texto">Click para abrir la invitación</p>
        <p class="reservado-titulo">Hemos Reservado</p>
        <div class="reservado-numero">2</div>
        <p class="reservado-subtitulo">Lugares en su Honor</p>
      </div>

    </div>

  </body>
</html>
