<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
    <title>Boda Carlos &amp; Elida</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --terracota: #b86b52;
        --terracota-dark: #5c3528;
        /* Tamaño del sobre y del botón: se calculan juntos para que el lacre
           siempre quede centrado en el borde superior del sobre */
        --sobre-w: clamp(180px, 62vw, 340px);
        --boton-w: clamp(60px, 20vw, 130px);
        /* El sobre tiene relación 340x221 ≈ 0.65 de alto.                    */
        /* El lacre se traslapa la mitad de su alto sobre el sobre.            */
        /* overlap = boton-w * 0.5  (porque es cuadrado)                      */
      }

      html { height: 100%; }

      body {
        min-height: 100dvh;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        font-family: 'Cormorant Garamond', Georgia, serif;
        background-color: #f5ece3;
        background-image: url('./assets/img/fondos/fondo1.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* ---- Flores: tamaño proporcional, posición fija en las esquinas ---- */
      .flor-izq {
        position: fixed;
        top: clamp(-120px, -15vw, -60px);
        left: clamp(-70px, -10vw, -40px);
        width: clamp(130px, 42vw, 300px);
        height: auto;
        pointer-events: none;
        z-index: 0;
        transform: scaleX(-1);
      }

      .flor-der {
        position: fixed;
        bottom: clamp(-80px, -12vw, -40px);
        right: clamp(-50px, -8vw, -20px);
        width: clamp(120px, 40vw, 250px);
        height: auto;
        pointer-events: none;
        z-index: 0;
      }

      /* ---- Contenedor principal ---- */
      .pagina {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: clamp(80px, 18vw, 150px) 24px clamp(40px, 8vw, 80px);
        gap: clamp(2px, 1.2vw, 10px);
      }

      .pretitulo {
        font-size: clamp(0.9rem, 3.8vw, 1.74rem);
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.9;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .nombres {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(2.6rem, 16vw, 4.2rem);
        color: var(--terracota-dark);
        line-height: 1.05;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .fecha {
        font-size: clamp(0.9rem, 3.8vw, 1.76rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.8;
        animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }

      /* ---- Bloque sobre + lacre ---- */
      /*  Estructura:                                          */
      /*  .sobre-bloque (relative, flex column)               */
      /*    [lacre .boton-img]  ← absolute, centrado arriba   */
      /*    [sobre  .sobre-img] ← ocupa todo el ancho         */
      .sobre-bloque {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: clamp(8px, 2.5vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        /* Padding-top = mitad del alto del lacre para que no se corte arriba */
        padding-top: calc(var(--boton-w) * 0.52);
      }

      .sobre-img {
        width: var(--sobre-w);
        height: auto;
        display: block;
        pointer-events: none;
        filter: drop-shadow(0 6px 20px rgba(92, 53, 40, 0.22));
      }

      /* Lacre: absolute centrado sobre el borde superior del sobre */
      .boton-img {
        position: absolute;
        top: 0;                        /* toca el padding-top del padre */
        left: 50%;
        transform: translateX(-50%);
        width: var(--boton-w);
        height: auto;
        display: block;
        cursor: pointer;
        z-index: 2;
        filter:
          sepia(1)
          saturate(2.2)
          hue-rotate(5deg)
          brightness(1.1)
          drop-shadow(0 4px 10px rgba(92, 53, 40, 0.22));
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .boton-img:hover {
        filter: sepia(1) saturate(2.2) hue-rotate(5deg) brightness(1.65)
          drop-shadow(0 8px 18px rgba(92, 53, 40, 0.3));
        transform: translateX(-50%) scale(1.07) translateY(-3px);
      }

      .boton-img:active {
        transform: translateX(-50%) scale(0.96);
      }

      /* ---- Sección "Hemos Reservado" ---- */
      .reservado-bloque {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 2vw, 10px);
        margin-top: clamp(14px, 4vw, 24px);
        animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      .click-texto {
        font-size: clamp(0.72rem, 2.8vw, 1rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota);
        opacity: 0.75;
      }

      .reservado-titulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 0.85;
        margin-top: 2px;
      }

      .reservado-numero {
        width: clamp(48px, 13vw, 76px);
        height: clamp(48px, 13vw, 76px);
        border: 2px solid var(--terracota-dark);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        font-weight: 400;
        color: var(--terracota-dark);
        opacity: 0.85;
      }

      .reservado-subtitulo {
        font-size: clamp(0.9rem, 3.5vw, 1.35rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--terracota-dark);
        opacity: 0.85;
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Pantallas muy pequeñas (iPhone SE 375px, altura < 700px) */
      @media (max-height: 700px) {
        .pagina {
          padding-top: clamp(60px, 12vw, 90px);
          gap: 2px;
        }
        .sobre-bloque  { margin-top: 6px; }
        .reservado-bloque { margin-top: 8px; gap: 4px; }
      }
    </style>
  </head>

  <body>

    <img src="./assets/img/sobre/flor1.png" alt="" class="flor-izq" aria-hidden="true" />
    <img src="./assets/img/sobre/flor2.png" alt="" class="flor-der" aria-hidden="true" />

    <div class="pagina">

      <p class="pretitulo">Nuestra Boda</p>
      <p class="nombres">Carlos &amp; Elida</p>
      <p class="fecha">13 &middot; Junio &middot; 2026</p>

      <div class="sobre-bloque">
        <!-- Lacre: absolute sobre el sobre -->
        <img
          src="./assets/img/sobre/boton.png"
          alt="Click para abrir la invitación"
          class="boton-img"
          width="130"
          height="130"
          loading="eager"
          onclick="window.location.href='./invitacion-boda.html'"
          role="button"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='./invitacion-boda.html';}"
        />
        <!-- Sobre -->
        <img
          src="./assets/img/sobre/sobres.png"
          alt="Sobre de invitación"
          class="sobre-img"
          width="340"
          height="221"
          loading="eager"
        />
      </div>

      <div class="reservado-bloque">
        <p class="click-texto">Click para abrir la invitación</p>
        <p class="reservado-titulo">Hemos Reservado</p>
        <div class="reservado-numero">2</div>
        <p class="reservado-subtitulo">Lugares en su Honor</p>
      </div>

    </div>

  </body>
</html>
